name: Build Floatify (Fabric)
on: [push, pull_request]

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Java 25 toolchain is required for 26.1+ on both loaders[cite: 2, 5]
          java-version: '25' 

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Fabric Mod
        # Specifically targets the Fabric module's build task[cite: 2]
        run: chmod +x gradlew && ./gradlew :fabric:build

      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floatify-fabric
          # The compiled jar will be located in this directory[cite: 2]
          path: fabric/build/libs/
