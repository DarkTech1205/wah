name: Build Floatify (Fabric)

on:  
  push:    
    branches: [ "main" ]  
  pull_request:  
  workflow_dispatch:

jobs:  
  build:    
    runs-on: ubuntu-latest    
    steps:      
      - name: Checkout repository        
        uses: actions/checkout@v4      

      - name: Set up JDK 25        
        uses: actions/setup-java@v4        
        with:          
          distribution: 'temurin'          
          java-version: '25'      

      - name: Set up Gradle        
        uses: gradle/actions/setup-gradle@v3        
        with:          
          # Gradle 9.1.0 is required for Java 25 support
          gradle-version: 9.1.0      

      # Finds the folder that actually contains settings.gradle
      - name: Locate the Gradle project root        
        id: locate        
        run: |          
          MATCH=$(find . -maxdepth 4 -name settings.gradle | head -n 1)          
          if [ -z "$MATCH" ]; then            
            echo "::error::No settings.gradle found anywhere in this repo. Check that the project files were actually uploaded."            
            exit 1          
          fi          
          DIR=$(dirname "$MATCH")          
          echo "Found Gradle project at: $DIR"          
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"      

      - name: Build Fabric with Gradle        
        working-directory: ${{ steps.locate.outputs.dir }}        
        run: gradle build --no-daemon      

      - name: Upload built mod jar        
        uses: actions/upload-artifact@v4        
        with:          
          name: floatify-fabric-jar          
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
