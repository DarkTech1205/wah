name: Build Floatify (Fabric)

on:  
  push:    
    branches: [ "main" ]  
  pull_request:  
  workflow_dispatch:

jobs:  
  build:    
    runs-on: ubuntu-latest    
    steps:      
      - name: Checkout repository        
        uses: actions/checkout@v4      

      - name: Set up JDK 25        
        uses: actions/setup-java@v4        
        with:          
          distribution: 'temurin'          
          java-version: '25'      

      - name: Set up Gradle        
        uses: gradle/actions/setup-gradle@v3        
        with:          
          # Hardcoded to a specific version that supports Java 25
          gradle-version: 8.12      

      # Finds the folder that actually contains settings.gradle, no matter how deep
      # the project got nested by an upload (e.g. repo/floatify-26.2/settings.gradle
      # instead of repo/settings.gradle). Fails loudly with a clear message if it's
      # missing entirely, instead of a confusing Gradle error.
      - name: Locate the Gradle project root        
        id: locate        
        run: |          
          MATCH=$(find . -maxdepth 4 -name settings.gradle | head -n 1)          
          if [ -z "$MATCH" ]; then            
            echo "::error::No settings.gradle found anywhere in this repo (searched 4 folders deep). Check that the project files were actually uploaded."            
            exit 1          
          fi          
          DIR=$(dirname "$MATCH")          
          echo "Found Gradle project at: $DIR"          
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"      

      - name: Build Fabric with Gradle        
        working-directory: ${{ steps.locate.outputs.dir }}        
        run: gradle :fabric:build --no-daemon      

      - name: Upload built mod jar        
        uses: actions/upload-artifact@v4        
        with:          
          name: floatify-fabric-jar          
          path: ${{ steps.locate.outputs.dir }}/fabric/build/libs/*.jar
