plugins {
    id 'fabric-loom' version '1.18.0-alpha.9'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "floatify-fabric"
}

repositories {
    // Fabric Loom already provides Fabric/Mojang/Minecraft repos.
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    // No mappings() call needed here vs pre-26.1 Loom - 26.2 ships
    // unobfuscated with Mojang's own names baked in, so Loom consumes
    // the jar directly instead of remapping it via a Yarn/official
    // mapping artifact. If your Loom version still requires an explicit
    // mappings block, use: mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.155.3+26.3"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Pull in the shared mixin + resources from ../common
sourceSets {
    main {
        java.srcDirs += "../common/src/main/java"
        resources.srcDirs += "../common/src/main/resources"
    }
}
