plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "floatify-fabric"
}

repositories {
    // Fabric Loom already provides Fabric/Mojang/Minecraft repos.
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    
    // Changed from modImplementation to standard implementation
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.3+26.3"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java.srcDirs += "common/src/main/java"
        resources.srcDirs += "common/src/main/resources"
    }
}
